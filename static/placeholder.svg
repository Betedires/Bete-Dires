<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b382c"/>
      <stop offset="50%" stop-color="#0e4d3c"/>
      <stop offset="100%" stop-color="#06261d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Rings -->
  <circle cx="300" cy="300" r="280" fill="none" stroke="#f5b324" stroke-width="3" opacity="0.4"/>
  <circle cx="300" cy="300" r="268" fill="none" stroke="#f5b324" stroke-width="1.5" opacity="0.25"/>

  <!-- Pin Shadow -->
  <ellipse cx="300" cy="355" rx="36" ry="9" fill="#000000" opacity="0.35"/>

  <!-- Location Pin -->
  <path d="M300 110 C 235 110 185 160 185 225 C 185 305 300 350 300 350 C 300 350 415 305 415 225 C 415 160 365 110 300 110 Z" fill="url(#goldGrad)"/>

  <!-- Inner Circle of Pin -->
  <circle cx="300" cy="222" r="70" fill="#fdfbf7"/>

  <!-- House inside Pin -->
  <!-- Roof -->
  <polygon points="300,175 255,215 345,215" fill="#d94132"/>
  <!-- House Base -->
  <rect x="268" y="215" width="64" height="42" fill="#0e4d3c"/>
  <!-- Windows -->
  <rect x="274" y="222" width="10" height="10" fill="#f5b324"/>
  <rect x="316" y="222" width="10" height="10" fill="#f5b324"/>
  <!-- Door / Package -->
  <rect x="294" y="228" width="12" height="29" fill="#f5b324"/>
  <line x1="294" y1="242" x2="306" y2="242" stroke="#d94132" stroke-width="2"/>
  <line x1="300" y1="228" x2="300" y2="257" stroke="#d94132" stroke-width="2"/>

  <!-- Swoop Arrow -->
  <path d="M 175 390 Q 300 445 425 385" fill="none" stroke="url(#arrowGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Arrow Head -->
  <polygon points="432,375 448,390 422,398" fill="#fbbf24"/>

  <!-- Brand Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#fdfbf7" letter-spacing="4">BETE DIRES</text>
  <text x="300" y="520" text-anchor="middle" font-family="'Noto Sans Ethiopic', 'Abyssinica SIL', sans-serif" font-size="28" font-weight="bold" fill="#f5b324" letter-spacing="2">ቤቴ ድረስ</text>
  <text x="300" y="555" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a7f3d0" letter-spacing="1">Doorstep Marketplace</text>
</svg>
